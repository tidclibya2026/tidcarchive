name: tidc-archive

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tidc_archive
      MYSQL_USER: tidc_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - tidc_mysql_data:/var/lib/mysql
    networks:
      - tidc-internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - tidc_minio_data:/data
    networks:
      - tidc-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      mc mb --ignore-existing "local/$$MINIO_BUCKET";
    networks:
      - tidc-internal

  clamav:
    image: clamav/clamav:1.4_base
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
      CLAMD_STARTUP_TIMEOUT: 900
    volumes:
      - tidc_clamav_data:/var/lib/clamav
    networks:
      - tidc-internal
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 5 localhost 3310 | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s

  ocr:
    build:
      context: ../..
      dockerfile: ops/local-windows/TIDC.OCR.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      OCR_HOST: 0.0.0.0
      OCR_PORT: 4310
      TIDC_APP_BASE_URL: http://app:3000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    networks:
      - tidc-internal
    depends_on:
      minio-init:
        condition: service_completed_successfully

  app:
    build:
      context: ../..
      dockerfile: ops/local-windows/TIDC.App.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://tidc_app:${MYSQL_APP_PASSWORD}@mysql:3306/tidc_archive
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_REGION: us-east-1
      LOCAL_OCR_ENDPOINT: http://ocr:4310
      ANTIVIRUS_ENABLED: "true"
      ANTIVIRUS_HOST: clamav
      ANTIVIRUS_PORT: 3310
      TIDC_INITIAL_ADMIN_EMAIL: ${TIDC_INITIAL_ADMIN_EMAIL}
      TIDC_INITIAL_ADMIN_PASSWORD: ${TIDC_INITIAL_ADMIN_PASSWORD}
    networks:
      - tidc-internal
      - tidc-edge
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ocr:
        condition: service_started
      clamav:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      TIDC_HOSTNAME: ${TIDC_HOSTNAME}
    ports:
      - "${TIDC_HTTP_PORT}:80"
      - "${TIDC_HTTPS_PORT}:443"
    volumes:
      - ./${TIDC_CADDYFILE}:/etc/caddy/Caddyfile:ro
      - tidc_caddy_data:/data
      - tidc_caddy_config:/config
    networks:
      - tidc-edge
    depends_on:
      app:
        condition: service_started

volumes:
  tidc_mysql_data:
  tidc_minio_data:
  tidc_clamav_data:
  tidc_caddy_data:
  tidc_caddy_config:

networks:
  tidc-internal:
    internal: true
  tidc-edge:
